# Render.com — Express API (free tier)
# Docs: https://render.com/docs/blueprint-spec
#
# After deploy, set CORS_ORIGIN to your Netlify URL and connect a cloud MySQL DB.

services:
  - type: web
    name: formcraft-api
    runtime: node
    plan: free
    buildCommand: npm run build:backend
    startCommand: npm run start:backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ADMIN_EMAILS
        value: admin@example.com
      # Set these in the Render dashboard after you create MySQL (TiDB / Railway / Aiven):
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: CORS_ORIGIN
        sync: false
